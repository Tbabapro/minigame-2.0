<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş AI Asistanı & Balon Oyunu</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg-bg: #2563eb;
            --ai-msg-bg: #334155;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Balon Alanı */
        #balloon-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .balloon {
            position: absolute;
            width: 45px;
            height: 55px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            bottom: -60px;
            cursor: pointer;
            pointer-events: auto;
            animation: floatUp 4s ease-out forwards;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3);
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -8px;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 8px solid currentColor;
        }

        /* Balonların tepede kalmasını sağlayan animasyon */
        @keyframes floatUp {
            0% {
                bottom: -60px;
                opacity: 0.9;
            }
            100% {
                bottom: calc(100% - 65px); /* Tepede takılı kalır */
                opacity: 1;
            }
        }

        .balloon.pop {
            animation: popAnim 0.2s ease-out forwards !important;
        }

        @keyframes popAnim {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Chat Header */
        header {
            background: var(--panel-bg);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        /* Main Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            z-index: 5;
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-in-out;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .user .avatar { background: var(--user-msg-bg); color: #fff; }
        .ai .avatar { background: var(--accent-color); color: var(--bg-color); }

        .bubble {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
            background: var(--ai-msg-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .user .bubble {
            background: var(--user-msg-bg);
            color: #fff;
        }

        /* Input Area */
        .input-area {
            background: var(--panel-bg);
            padding: 20px;
            border-top: 1px solid var(--border-color);
            z-index: 5;
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 12px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            height: 24px;
        }

        .send-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="balloon-container"></div>

    <header>
        <div class="logo">
            <i class="fa-solid fa-robot"></i>
            <span>Nova AI Asistanı</span>
        </div>
        <span style="font-size:0.8rem; color:var(--text-muted)">Mesaj atınca balonlar çıkar, patlatabilirsin! 🎈</span>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            <div class="avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="bubble">
                Merhaba! Sorularını sorabilirsin. Her mesaj yazdığında yukarı uçan ve tepede bekleyen renkli balonlar çıkacak, üzerlerine tıklayarak patlatabilirsin!
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="Bir şeyler yazın..."></textarea>
            <button class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const API_KEY = "YOUR_GEMINI_API_KEY"; // Buraya Google AI Studio'dan aldığın ücretsiz Gemini API anahtarını koyabilirsin.

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const balloonContainer = document.getElementById('balloon-container');

        const balloonColors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendMessage('user', text);

            // Balonları fırlat!
            createBalloons(5);

            const aiMsg = appendMessage('ai', 'Düşünüyor...');
            const bubble = aiMsg.querySelector('.bubble');

            try {
                if(API_KEY !== "YOUR_GEMINI_API_KEY") {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
                    });
                    const data = await response.json();
                    bubble.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    // API Key girilmediyse hazır cevap gösterir
                    setTimeout(() => {
                        bubble.innerText = `"${text}" sorunu aldım! (Tam yapay zeka cevabı almak için koddaki API_KEY kısmına kendi anahtarını eklemelisin).`;
                    }, 1000);
                }
            } catch (err) {
                bubble.innerText = "Bir hata oluştu, lütfen API anahtarını kontrol et.";
            }
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = `
                <div class="avatar"><i class="fa-solid fa-${sender === 'user' ? 'user' : 'robot'}"></i></div>
                <div class="bubble">${text}</div>
            `;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        // Balon Oluşturma Fonksiyonu
        function createBalloons(count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.className = 'balloon';
                    
                    const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
                    balloon.style.backgroundColor = color;
                    balloon.style.color = color;
                    balloon.style.left = Math.random() * 85 + 5 + '%';

                    // Tıklayınca patlama olayı
                    balloon.addEventListener('click', () => {
                        balloon.classList.add('pop');
                        setTimeout(() => balloon.remove(), 200);
                    });

                    balloonContainer.appendChild(balloon);
                }, i * 300);
            }
        }
    </script>
</body>
</html>
