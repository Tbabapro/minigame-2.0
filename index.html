<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
*{
    box-sizing:border-box;
    margin:0;

}

body{
    font-family:Arial,sans-serif;

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        <span>AI</span> Araştırmacı
    </div>

    <button class="newChat" onclick="newChat()">
        + Yeni Sohbet
    </button>

    <div class="historyTitle">
        SOHBETLER
    </div>

    <div id="history"></div>

</aside>


<main class="main">

<header class="header">

    🔎 AI Araştırmacı

    <div class="status">
        ● Aktif
    </div>

</header>


<section class="chat" id="chat">

<div class="welcome" id="welcome">

    <h1>
        Merhaba 👋<br>
        <span>Ne öğrenmek istiyorsun?</span>
    </h1>

    <p>
        Bana bir soru sor. Sorunun konusunu analiz edip
        uygun bir cevap oluşturmaya çalışacağım.
    </p>

</div>

</section>


<div class="inputArea">

<div class="inputBox">

<textarea
id="question"
placeholder="Örneğin: Dünya'nın en büyük ülkesi hangisi?"
onkeydown="handleKey(event)"
></textarea>

<button class="send" onclick="askAI()">➤</button>

</div>

<div class="info">
    Enter = Gönder • Shift + Enter = Yeni satır
</div>

</div>

</main>

</div>


<script>

let conversations =
JSON.parse(localStorage.getItem("aiHistory") || "[]");


// ENTER

function handleKey(e){

    if(e.key==="Enter" && !e.shiftKey){

        e.preventDefault();

        askAI();

    }

}


// HTML GÜVENLİĞİ

function escapeHTML(text){

    return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// MESAJ

function addMessage(type,text,research=false){

    const chat=document.getElementById("chat");

    const div=document.createElement("div");

    div.className="message "+type;

    div.innerHTML=`

        <div class="avatar">
            ${type==="user" ? "👤" : "🤖"}
        </div>

        <div>

            ${research ? `
                <div class="research">
                    🔎 Sorun analiz ediliyor...
                </div>
            `:""}

            <div class="messageContent">
                ${escapeHTML(text)}
            </div>

        </div>
    `;

    chat.appendChild(div);

    chat.scrollTop=chat.scrollHeight;

    return div;
}


// SORUYU ANALİZ ET

function generateAnswer(question){

    const q=question.toLowerCase().trim();


    // SELAMLAMA

    if(
        q==="merhaba" ||
        q==="selam" ||
        q==="sa" ||
        q.includes("merhaba")
    ){

        return "Merhaba! 👋 Ben AI Araştırmacı. Bana tarih, bilim, teknoloji, oyunlar, matematik veya başka bir konu hakkında soru sorabilirsin.";

    }


    // KİMSİN

    if(
        q.includes("kimsin") ||
        q.includes("nesin") ||
        q.includes("ne yapabiliyorsun")
    ){

        return "Ben bu sitenin yapay zekâ asistanıyım. Sorularını analiz edip elimdeki bilgi ve kurallara göre cevap oluşturmaya çalışıyorum.";

    }


    // TÜRKİYE

    if(
        q.includes("türkiye") &&
        (
            q.includes("başkent") ||
            q.includes("başkenti")
        )
    ){

        return "Türkiye'nin başkenti Ankara'dır. 🇹🇷";

    }


    // DÜNYA

    if(
        q.includes("dünya") &&
        q.includes("en büyük ülke")
    ){

        return "Yüzölçümü bakımından dünyanın en büyük ülkesi Rusya'dır.";

    }


    // GÜNEŞ

    if(
        q.includes("güneş") &&
        (
            q.includes("gezegen") ||
            q.includes("yıldız")
        )
    ){

        return "Güneş bir yıldızdır. Dünya'nın da içinde bulunduğu Güneş Sistemi'nin merkezindedir.";

    }


    // SU

    if(
        q.includes("su") &&
        (
            q.includes("kaç derece") ||
            q.includes("don")
        )
    ){

        return "Saf su, normal atmosfer basıncında yaklaşık 0°C'de donar.";

    }


    // PYTHON

    if(
        q.includes("python") &&
        (
            q.includes("nedir") ||
            q.includes("ne")
        )
    ){

        return "Python, okunması kolay sözdizimine sahip, çok amaçlı bir programlama dilidir. Web geliştirme, yapay zekâ, veri analizi ve oyun geliştirme gibi birçok alanda kullanılır.";

    }


    // MINECRAFT

    if(q.includes("minecraft")){

        return "Minecraft, oyuncuların bloklardan oluşan bir dünyayı keşfedip inşa edebildiği bir sandbox oyunudur. Hayatta kalma, yaratıcı ve macera gibi farklı oynanış biçimleri bulunur.";

    }


    // MATEMATİK

    if(
        q.includes("kaç") &&
        /\d/.test(q)
    ){

        const numbers=q.match(/\d+/g);

        if(numbers && numbers.length>=2){

            const a=Number(numbers[0]);
            const b=Number(numbers[1]);

            if(q.includes("+") || q.includes("topla")){

                return `${a} + ${b} = ${a+b}`;

            }

            if(q.includes("-") || q.includes("çıkar")){

                return `${a} - ${b} = ${a-b}`;

            }

            if(
                q.includes("*") ||
                q.includes("çarp")
            ){

                return `${a} × ${b} = ${a*b}`;

            }

            if(
                q.includes("/") ||
                q.includes("böl")
            ){

                if(b!==0){

                    return `${a} ÷ ${b} = ${a/b}`;

                }

            }

        }

    }


    // TARİH

    if(
        q.includes("atatürk") ||
        q.includes("mustafa kemal")
    ){

        return "Mustafa Kemal Atatürk, Türkiye Cumhuriyeti'nin kurucusu ve ilk Cumhurbaşkanıdır. 1881'de Selanik'te doğmuş, 10 Kasım 1938'de İstanbul'da vefat etmiştir.";

    }


    // HAYVANLAR

    if(
        q.includes("hayvan") &&
        (
            q.includes("en hızlı") ||
            q.includes("hızlı")
        )
    ){

        return "Karada en hızlı hayvan çitadır. Kısa mesafelerde çok yüksek hızlara ulaşabilir.";

    }


    // OYUN

    if(
        q.includes("oyun") &&
        q.includes("yap")
    ){

        return "Oyun yapmak için HTML, CSS ve JavaScript ile tarayıcı tabanlı oyunlar geliştirebilirsin. Daha gelişmiş oyunlar için Python, C# veya C++ gibi diller de kullanılabilir.";

    }


    // GENEL SORU

    return `
Sorunu anladım:

"${question}"

Bu soru için şu anda yerleşik bilgi tabanımda
doğrudan eşleşen bir cevap bulunamadı.

Gerçek araştırma modu bağlandığında sistem:

🔎 Web'de arama yapacak
📚 Birden fazla kaynağı inceleyecek
🧠 Bilgileri karşılaştıracak
✍️ Sonuçları özetleyecek
🔗 Kaynakları gösterecek

Yani bu sürümün asıl eksik kısmı yapay zekâ ve web araştırma API bağlantısıdır.
`;

}


// SOR

async function askAI(){

    const input=document.getElementById("question");

    const question=input.value.trim();

    if(!question) return;

    document.getElementById("welcome")?.remove();

    input.value="";

    addMessage("user",question);

    const loading=addMessage(
        "ai",
        "Soruyu analiz ediyorum...",
        true
    );

    await new Promise(
        resolve=>setTimeout(resolve,700)
    );

    loading.remove();

    const answer=generateAnswer(question);

    addMessage("ai",answer);

    saveHistory(question);

}


// GEÇMİŞE KAYDET

function saveHistory(question){

    conversations.push(question);

    if(conversations.length>30){

        conversations.shift();

    }

    localStorage.setItem(
        "aiHistory",
        JSON.stringify(conversations)
    );

    loadHistory();

}


// GEÇMİŞİ GÖSTER

function loadHistory(){

    const history=
        document.getElementById("history");

    history.innerHTML="";

    conversations
    .slice()
    .reverse()
    .forEach(question=>{

        const item=
            document.createElement("div");

        item.className="historyItem";

        item.textContent=
            question.length>28
            ? question.substring(0,28)+"..."
            : question;

        item.onclick=()=>{

            document.getElementById("question").value=
                question;

        };

        history.appendChild(item);

    });

}


// YENİ SOHBET

function newChat(){

    document.getElementById("chat").innerHTML=`

        <div class="welcome" id="welcome">

            <h1>
                Yeni sohbet 🚀<br>
                <span>Ne öğrenmek istiyorsun?</span>
            </h1>

            <p>
                Sorunu yaz ve başlayalım.
            </p>

        </div>
    `;

}


loadHistory();

</script>

</body>
</html>
