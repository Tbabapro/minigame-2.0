<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deneyap Gemi Tasarımı - 3D Modeli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #canvas-container { flex: 1; width: 100%; height: 100%; position: relative; }
        
        /* UI Panel */
        .ui-overlay { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; flex-direction: column; gap: 10px; max-width: 320px; }
        .card { background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { font-size: 1.2rem; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
        p { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
        
        /* Controls */
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        button { background: #2563eb; color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { background: #1d4ed8; transform: translateY(-1px); }
        button.active { background: #059669; }
        
        /* Info Panel */
        .info-panel { position: absolute; bottom: 20px; right: 20px; z-index: 10; max-width: 300px; display: none; }
        .info-title { font-size: 1rem; color: #f59e0b; margin-bottom: 4px; font-weight: bold; }
        .info-desc { font-size: 0.8rem; color: #cbd5e1; }
        
        /* Water Status indicator */
        .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; padding: 4px 8px; border-radius: 20px; background: rgba(56, 189, 248, 0.1); color: #38bdf8; width: fit-content; margin-top: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
        .dot.active { background: #10b981; box-shadow: 0 0 8px #10b981; }
    </style>
    <!-- Three.js Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container">
        <div class="ui-overlay">
            <div class="card">
                <h1>Gemi Tasarımı (3D)</h1>
                <p>Su geçirmez kılıflı DC motor ve şaft aktarımlı hava itişli tekne modeli.</p>
                
                <div class="status-badge">
                    <span class="dot" id="motor-dot"></span>
                    <span id="motor-status">Motor: Kapalı</span>
                </div>

                <div class="btn-group">
                    <button id="btn-toggle-motor">⚡ Motoru Çalıştır / Durdur</button>
                    <button id="btn-explode">🧩 Demonte (Katmanlı) Görünüm</button>
                    <button id="btn-reset">🔄 Kamera Sıfırla</button>
                </div>
            </div>
        </div>

        <div class="card info-panel" id="info-card">
            <div class="info-title" id="part-title">Parça Adı</div>
            <div class="info-desc" id="part-desc">Parçanın işlevi ve detayları...</div>
        </div>
    </div>

    <script>
        // --- 1. SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1d);
        scene.fog = new THREE.FogExp2(0x0a0f1d, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(4, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below water

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        const blueLight = new THREE.PointLight(0x38bdf8, 1, 10);
        blueLight.position.set(0, 1, 0);
        scene.add(blueLight);

        // --- 3. WATER SURFACE ---
        const waterGeo = new THREE.PlaneGeometry(30, 30, 64, 64);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x0284c7,
            roughness: 0.1,
            metalness: 0.8,
            transparent: true,
            opacity: 0.8
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = -0.2;
        scene.add(water);

        // --- 4. BOAT MODEL GROUP ---
        const boatGroup = new THREE.Group();
        scene.add(boatGroup);

        // Materials
        const styrofoamMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.9, name: "Gövde (Strafor)" });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.7, name: "Kule (Dil Çubukları)" });
        const casingMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x38bdf8, 
            transparent: true, 
            opacity: 0.6, 
            roughness: 0.1, 
            transmission: 0.9,
            name: "Su Geçirmez Motor Kılıfı" 
        });
        const motorMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.8, roughness: 0.2, name: "DC Motor" });
        const propMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3, name: "Pervane" });
        const batteryMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, name: "Pil Yatağı & Piller" });
        const weightMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.9, roughness: 0.1, name: "Denge Somunu (Ağırlık)" });

        // Parts Map for Exploded View
        const parts = {};

        // A. HULL (Strafor Gövde)
        const hullShape = new THREE.Shape();
        hullShape.moveTo(0, 1.2);
        hullShape.lineTo(0.6, 0.4);
        hullShape.lineTo(0.6, -1.2);
        hullShape.lineTo(-0.6, -1.2);
        hullShape.lineTo(-0.6, 0.4);
        hullShape.closePath();

        const extrudeSettings = { depth: 0.3, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
        const hullGeo = new THREE.ExtrudeGeometry(hullShape, extrudeSettings);
        const hull = new THREE.Mesh(hullGeo, styrofoamMat);
        hull.rotation.x = Math.PI / 2;
        hull.position.y = 0;
        hull.castShadow = true;
        hull.receiveShadow = true;
        hull.userData = { title: "V-Tipi Strafor Gövde", desc: "Su direncini keser ve yüksek kaldırma kuvveti sağlayarak geminin batmasını engeller." };
        boatGroup.add(hull);
        parts.hull = { obj: hull, origY: 0, targetY: -0.8 };

        // B. TOWER (Dil Çubukları Kule)
        const towerGroup = new THREE.Group();
        const legGeo = new THREE.BoxGeometry(0.06, 0.9, 0.06);
        const leg1 = new THREE.Mesh(legGeo, woodMat); leg1.position.set(-0.25, 0.45, -0.2); leg1.rotation.z = -0.15;
        const leg2 = new THREE.Mesh(legGeo, woodMat); leg2.position.set(0.25, 0.45, -0.2); leg2.rotation.z = 0.15;
        const leg3 = new THREE.Mesh(legGeo, woodMat); leg3.position.set(-0.25, 0.45, 0.2); leg3.rotation.z = -0.15;
        const leg4 = new THREE.Mesh(legGeo, woodMat); leg4.position.set(0.25, 0.45, 0.2); leg4.rotation.z = 0.15;
        const platformGeo = new THREE.BoxGeometry(0.5, 0.05, 0.5);
        const platform = new THREE.Mesh(platformGeo, woodMat); platform.position.set(0, 0.9, 0);

        towerGroup.add(leg1, leg2, leg3, leg4, platform);
        towerGroup.userData = { title: "Ahşap Taşıyıcı Kule", desc: "Motoru su seviyesinin üstüne çıkararak sudan korur ve hava akımını yüksek tutar." };
        boatGroup.add(towerGroup);
        parts.tower = { obj: towerGroup, origY: 0, targetY: 0.2 };

        // C. WATERPROOF CASING & DC MOTOR (Tepede)
        const motorGroup = new THREE.Group();
        motorGroup.position.set(0, 1.1, 0);

        // Waterproof Housing
        const casingGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.45, 16);
        const casing = new THREE.Mesh(casingGeo, casingMat);
        casing.rotation.x = Math.PI / 2;
        casing.userData = { title: "Su Geçirmez Kılıf/Muhafaza", desc: "DC motoru su sıçramalarından tamamen izole eden şeffaf koruyucu kaplama." };

        // Internal DC Motor
        const dcMotorGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.35, 16);
        const dcMotor = new THREE.Mesh(dcMotorGeo, motorMat);
        dcMotor.rotation.x = Math.PI / 2;
        dcMotor.userData = { title: "DC Elektrik Motoru", desc: "Pilden aldığı elektrik enerjisini yüksek devirli mekanik dönme hareketine çevirir." };

        // Shaft (Aktarım Mili)
        const shaftGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.2, 8);
        const shaft = new THREE.Mesh(shaftGeo, weightMat);
        shaft.rotation.x = Math.PI / 2;
        shaft.position.z = 0.22;

        motorGroup.add(casing, dcMotor, shaft);
        boatGroup.add(motorGroup);
        parts.motor = { obj: motorGroup, origY: 1.1, targetY: 1.8 };

        // D. PROPELLER (Pervane - Motora Bağlı Tepede)
        const propGroup = new THREE.Group();
        propGroup.position.set(0, 1.1, 0.3); // Directly on shaft

        const centerHub = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.06, 12), propMat);
        centerHub.rotation.x = Math.PI / 2;
        propGroup.add(centerHub);

        const bladeGeo = new THREE.BoxGeometry(0.4, 0.08, 0.02);
        for(let i=0; i<3; i++) {
            const blade = new THREE.Mesh(bladeGeo, propMat);
            blade.rotation.z = (i * Math.PI * 2) / 3;
            propGroup.add(blade);
        }
        propGroup.userData = { title: "3 Kanatlı İtiş Pervanesi", desc: "Motor mili üzerinden dönerek havayı geriye iter ve etki-tepki prensibiyle gemiyi ileri yürütür." };
        boatGroup.add(propGroup);
        parts.propeller = { obj: propGroup, origY: 1.1, targetY: 2.3 };

        // E. BATTERY & WEIGHTS (Gövde Üstü / Taban)
        const batGeo = new THREE.BoxGeometry(0.35, 0.15, 0.25);
        const battery = new THREE.Mesh(batGeo, batteryMat);
        battery.position.set(0, 0.18, -0.4);
        battery.userData = { title: "Pil Yatağı & Piller", desc: "Sistem için gerekli doğru akım (DC) enerjisini sağlar." };
        boatGroup.add(battery);
        parts.battery = { obj: battery, origY: 0.18, targetY: -0.3 };

        const weightGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.04, 12);
        const weight1 = new THREE.Mesh(weightGeo, weightMat); weight1.position.set(-0.2, -0.05, 0);
        const weight2 = new THREE.Mesh(weightGeo, weightMat); weight2.position.set(0.2, -0.05, 0);
        boatGroup.add(weight1, weight2);

        // --- 5. INTERACTION & ANIMATION STATE ---
        let isMotorRunning = false;
        let isExploded = false;
        const clock = new THREE.Clock();

        // UI Buttons Logic
        const btnMotor = document.getElementById('btn-toggle-motor');
        const btnExplode = document.getElementById('btn-explode');
        const btnReset = document.getElementById('btn-reset');
        const motorDot = document.getElementById('motor-dot');
        const motorStatus = document.getElementById('motor-status');

        btnMotor.addEventListener('click', () => {
            isMotorRunning = !isMotorRunning;
            btnMotor.classList.toggle('active', isMotorRunning);
            motorDot.classList.toggle('active', isMotorRunning);
            motorStatus.innerText = isMotorRunning ? "Motor: Çalışıyor (Yüksek Devir)" : "Motor: Kapalı";
        });

        btnExplode.addEventListener('click', () => {
            isExploded = !isExploded;
            btnExplode.classList.toggle('active', isExploded);
        });

        btnReset.addEventListener('click', () => {
            camera.position.set(4, 3, 5);
            controls.target.set(0, 0, 0);
        });

        // Raycasting for object selection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const infoCard = document.getElementById('info-card');
        const partTitle = document.getElementById('part-title');
        const partDesc = document.getElementById('part-desc');

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(boatGroup.children, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && obj.parent !== boatGroup && !obj.userData.title) {
                    obj = obj.parent;
                }
                if (obj.userData && obj.userData.title) {
                    partTitle.innerText = obj.userData.title;
                    partDesc.innerText = obj.userData.desc;
                    infoCard.style.display = 'block';
                }
            }
        });

        // --- 6. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Water Ripple Effect
            const pos = waterGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const u = pos.getX(i);
                const v = pos.getY(i);
                const z = Math.sin(u * 1.5 + time * 2) * 0.03 + Math.cos(v * 1.5 + time * 1.5) * 0.03;
                pos.setZ(i, z);
            }
            waterGeo.computeVertexNormals();
            waterGeo.attributes.position.needsUpdate = true;

            // Motor & Propeller Spin
            if (isMotorRunning) {
                propGroup.rotation.z += 0.4; // High speed rotation
                boatGroup.position.y = Math.sin(time * 8) * 0.01; // Gentle boat vibration
            } else {
                boatGroup.position.y = Math.sin(time * 2) * 0.02; // Gentle water floating
            }

            // Exploded View Lerp Animation
            for (const key in parts) {
                const item = parts[key];
                const targetY = isExploded ? item.targetY : item.origY;
                item.obj.position.y += (targetY - item.obj.position.y) * 0.1;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
