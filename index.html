
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talha'yı Ne Kadar Tanıyorsun?</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;min-height:100vh;font-family:Arial,sans-serif;color:white;background:radial-gradient(circle at top,#51268a,#111027 70%)}
.container{max-width:720px;margin:20px auto;padding:25px;background:#19172f;border:1px solid #8067e9;border-radius:25px;box-shadow:0 0 35px #7854ff40}
header{text-align:center}
.logo{font-size:60px}
h1{font-size:clamp(27px,5vw,39px);color:#d5c5ff}
.subtitle{color:#c8c0df;line-height:1.6}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}
.stat{background:#292440;padding:12px;border-radius:12px}
button{border:0;border-radius:12px;padding:14px 18px;margin:6px;font-size:15px;font-weight:bold;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-2px)}
.primary{background:linear-gradient(100deg,#8056f5,#c04fe8);color:white}
.secondary{background:#302b48;color:white}
.hidden{display:none!important}
.bar{height:9px;background:#302744;border-radius:20px;overflow:hidden;margin-top:12px}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#ff70d9);transition:.3s}
#progress{color:#d0baff;font-weight:bold}
#question{font-size:22px;line-height:1.5;margin:25px 0}
.option{display:block;width:100%;margin:10px 0;text-align:left;background:#292641;color:white;border:1px solid #51476e}
.option:hover{background:#423365}
.option:disabled{opacity:1;cursor:default}
.option.correct{background:#176b4a;border-color:#43e5a0}
.option.wrong{background:#7d2b46;border-color:#ff7398}
#feedback{min-height:28px;margin:15px;font-weight:bold}
#result{font-size:32px;color:#ffe18a}
.reward{margin:20px 0;padding:22px;background:linear-gradient(135deg,#352558,#24203f);border:1px solid #8a6ee9;border-radius:18px}
#rewardIcon{font-size:50px}
.small{font-size:13px;color:#aaa1c5;line-height:1.6}
footer{text-align:center;color:#8e85a9;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="container">
<header>
<div class="logo">😎</div>
<h1>Talha'yı Ne Kadar Tanıyorsun?</h1>
<p class="subtitle">Talha'yı gerçekten tanıyor musun? Bakalım kaç soruyu bilebileceksin! 💜</p>
</header>

<div class="stats">
<div class="stat">🏆 Rekor: <b id="best">0</b></div>
<div class="stat">⭐ Toplam puan: <b id="total">0</b></div>
</div>

<section id="startScreen" style="text-align:center">
<div class="reward">
<div style="font-size:45px">🧠</div>
<h2>Talha hakkında ne biliyorsun?</h2>
<p class="subtitle">12 soru, 120 puan ve testin sonunda sana özel bir unvan!</p>
</div>
<button class="primary" onclick="startQuiz()">🚀 Teste Başla</button>
</section>

<section id="quizScreen" class="hidden">
<div id="progress">Soru 1 / 12</div>
<div class="bar"><div id="barFill"></div></div>
<h2 id="question"></h2>
<div id="options"></div>
<div id="feedback"></div>
<div style="text-align:center">
<button id="nextBtn" class="primary hidden" onclick="nextQuestion()">Sonraki ➜</button>
</div>
</section>

<section id="resultScreen" class="hidden" style="text-align:center">
<div id="resultEmoji" style="font-size:55px">🏆</div>
<h2>Test bitti!</h2>
<div id="result"></div>
<p id="resultMessage" class="subtitle"></p>
<div class="reward">
<div id="rewardIcon">🎁</div>
<h2 id="rewardTitle">Ödülün</h2>
<p id="rewardText"></p>
</div>
<button class="primary" onclick="startQuiz()">🔄 Yeniden Dene</button>
<button class="secondary" onclick="copyResult()">📋 Sonucumu Kopyala</button>
<button class="secondary" onclick="home()">🏠 Ana Sayfa</button>
<p id="copyMessage" class="small"></p>
</section>

<footer>Talha'nın özel testi 💜</footer>
</div>

<script>
const bank=[
{q:"Talha'nın en sevdiği oyun hangisi?",a:["Minecraft","Roblox","Fortnite","GTA"],c:0},
{q:"Talha'nın Brawl Stars'ta en sevdiği karakter kim?",a:["Leon","Frank","Spike","Mortis"],c:1},
{q:"Talha'nın doğum günü hangi tarihte?",a:["5 Mart","12 Nisan","12 Mart","20 Şubat"],c:2},
{q:"Talha'nın burcu hangisi?",a:["Aslan","Koç","Akrep","Balık"],c:3},
{q:"Talha'nın en yakın arkadaşları kimler?",a:["Ömer ve Yasin","Ali ve Mehmet","Efe ve Can","Mert ve Arda"],c:0},
{q:"Talha'nın hayalindeki özel güçlerden biri ne?",a:["Zamanı durdurmak","Yemek yiyip kilo almamak","Uçmak","Görünmez olmak"],c:1},
{q:"Talha kaç yaşında olduğunu söylemişti?",a:["9","13","11","15"],c:2},
{q:"Talha'nın annesinin adı ne?",a:["Elif","Zeynep","Fatma","Aynur"],c:3},
{q:"Talha oyun oynamayı sevdiğinde akla ilk gelen favori oyunu hangisi?",a:["Minecraft","The Sims","FIFA","Among Us"],c:0},
{q:"Talha'nın Brawl Stars favorisi olan Frank hangi oyunun karakteri?",a:["Minecraft","Brawl Stars","Roblox","Clash Royale"],c:1},
{q:"Talha hangi ayda doğmuş?",a:["Ocak","Mayıs","Mart","Eylül"],c:2},
{q:"Talha'nın burcu Balık olduğuna göre doğum günü hangi mevsimdedir?",a:["Yaz","Sonbahar","Kışın sonu kesinlikle değil","Kışın sonu veya ilkbaharın başı"],c:3},
{q:"Talha'nın iki yakın arkadaşından biri kim?",a:["Ömer","Kerem","Kaan","Burak"],c:0},
{q:"Talha'nın istediği özel güç hangi seçenekle aynı anlama geliyor?",a:["Bir anda ışınlanmak","İstediği kadar yemek yiyebilmek ve kilo almamak","Hayvanlarla konuşmak","Duvarlardan geçmek"],c:1},
{q:"Talha'nın en sevdiği oyun dünyasında çoğunlukla neyle inşa yapılır?",a:["Kartlarla","Arabalarla","Bloklarla","Bulmacalarla"],c:2},
{q:"Talha'nın en sevdiği Brawl Stars karakteri kimdi?",a:["Shelly","Colt","Piper","Frank"],c:3},
{q:"Talha'nın doğum günü hangi gün ve ay?",a:["12 Mart","12 Haziran","3 Mart","21 Nisan"],c:0},
{q:"Talha'nın yakın arkadaşlarından diğerinin adı ne?",a:["Emir","Yasin","Arda","Efe"],c:1},
{q:"Talha'nın özel güç hayali aşağıdakilerden hangisi?",a:["Denizin altında yaşamak","Geleceği görmek","Yemek yiyip kilo almamak","Bir anda büyümek"],c:2},
{q:"Talha hangi oyunu oynamayı en sevdiğini söylemişti?",a:["Valorant","Rocket League","FIFA","Minecraft"],c:3},
{q:"Talha'nın sevdiği Brawl Stars karakteri hangi karakter?",a:["Frank","Crow","Edgar","Bibi"],c:0},
{q:"Talha'nın doğum ayı hangisi?",a:["Temmuz","Mart","Kasım","Aralık"],c:1},
{q:"Talha'nın burcunu doğru bilen kişi hangisini seçmeli?",a:["Yay","Başak","Balık","İkizler"],c:2},
{q:"Talha'nın en yakın arkadaşlarından biri olan Yasin'in diğer yakın arkadaşı kim?",a:["Mert","Can","Efe","Ömer"],c:3},
{q:"Talha'nın istediği özel güçle ilgili doğru ifade hangisi?",a:["Yemek yiyip kilo almamak","Her dili konuşmak","Geçmişe gitmek","Süper hızlı koşmak"],c:0},
{q:"Talha'nın favori oyunu olan Minecraft nasıl bir oyundur?",a:["Sadece futbol oyunu","Bloklarla keşif ve inşa oyunu","Sadece yarış oyunu","Müzik oyunu"],c:1},
{q:"Talha'nın en sevdiği Brawl Stars karakteri ağır çekiciyle tanınan kim?",a:["Poco","Nita","Frank","Jessie"],c:2},
{q:"Talha'nın doğum tarihi hangisi?",a:["3 Mart","12 Mayıs","20 Mart","12 Mart"],c:3},
{q:"Talha'nın burcu hangisidir?",a:["Balık","Terazi","Oğlak","Boğa"],c:0},
{q:"Talha'nın yakın arkadaşları arasında kimler var?",a:["Ali ve Veli","Ömer ve Yasin","Mert ve Can","Efe ve Emir"],c:1},
{q:"Talha'nın hayalindeki güç hangi günlük isteğiyle ilgili?",a:["Daha hızlı uyumak","Daha iyi yüzmek","Yemek yiyip kilo almamak","Daha uzun boylu olmak"],c:2},
{q:"Talha'nın favori oyununu seç:",a:["Fortnite","Among Us","Roblox","Minecraft"],c:3},
{q:"Talha'nın Brawl Stars'taki favori karakteri hangisi?",a:["Frank","Spike","Leon","Shelly"],c:0},
{q:"Talha'nın doğum günü hangi ayda?",a:["Nisan","Mart","Haziran","Ekim"],c:1},
{q:"Talha'nın burcu için doğru seçenek hangisi?",a:["Koç","Aslan","Balık","Akrep"],c:2},
{q:"Talha'nın yakın arkadaşlarından birinin adı Ömer ise diğerinin adı ne?",a:["Kaan","Emir","Mert","Yasin"],c:3},
{q:"Talha'nın en sevdiği oyun hangisi?",a:["Minecraft","GTA","FIFA","Valorant"],c:0},
{q:"Talha'nın en sevdiği Brawl Stars karakteri?",a:["Crow","Frank","Mortis","Dynamike"],c:1},
{q:"Talha'nın doğum günü için doğru tarih hangisi?",a:["12 Şubat","10 Mart","12 Mart","12 Nisan"],c:2},
{q:"Talha'nın özel güç dileği hangisi?",a:["Işınlanmak","Zihin okumak","Zamanı durdurmak","Yemek yiyip kilo almamak"],c:3}
];

const letters=["A","B","C","D"];
let questions=[],index=0,score=0,answered=false,lastResult="";

function shuffle(arr){
 for(let i=arr.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}
function updateStats(){
 document.getElementById("best").textContent=localStorage.getItem("talhaPersonalBest")||0;
 document.getElementById("total").textContent=localStorage.getItem("talhaPersonalTotal")||0;
}
function startQuiz(){
 questions=shuffle(bank.slice()).slice(0,12).map(q=>({...q}));
 const positions=shuffle([0,0,0,1,1,1,2,2,2,3,3,3]);
 questions.forEach((q,i)=>{
  const correct=q.a[q.c];
  const wrong=shuffle(q.a.filter((_,j)=>j!==q.c));
  let k=0;
  q.options=Array.from({length:4},(_,j)=>j===positions[i]?correct:wrong[k++]);
  q.correct=positions[i];
 });
 index=0;score=0;answered=false;
 document.getElementById("startScreen").classList.add("hidden");
 document.getElementById("resultScreen").classList.add("hidden");
 document.getElementById("quizScreen").classList.remove("hidden");
 render();
}
function render(){
 answered=false;
 const q=questions[index];
 document.getElementById("progress").textContent=`Soru ${index+1} / 12`;
 document.getElementById("barFill").style.width=(index/12*100)+"%";
 document.getElementById("question").textContent=q.q;
 document.getElementById("feedback").textContent="";
 document.getElementById("nextBtn").classList.add("hidden");
 const box=document.getElementById("options");
 box.innerHTML="";
 q.options.forEach((opt,i)=>{
  const b=document.createElement("button");
  b.className="option";
  b.textContent=letters[i]+") "+opt;
  b.onclick=()=>answer(i);
  box.appendChild(b);
 });
}
function answer(n){
 if(answered)return;
 answered=true;
 const q=questions[index];
 document.querySelectorAll(".option").forEach((b,i)=>{
  b.disabled=true;
  if(i===q.correct)b.classList.add("correct");
  if(i===n&&i!==q.correct)b.classList.add("wrong");
 });
 if(n===q.correct){
  score+=10;
  document.getElementById("feedback").textContent="🎉 Doğru! +10 puan";
  document.getElementById("feedback").style.color="#65f0ad";
 }else{
  document.getElementById("feedback").textContent="🙈 Yanlış! Doğru cevap: "+q.options[q.correct];
  document.getElementById("feedback").style.color="#ff8ba9";
 }
 document.getElementById("nextBtn").textContent=index===11?"🏆 Sonucu Gör":"Sonraki ➜";
 document.getElementById("nextBtn").classList.remove("hidden");
}
function nextQuestion(){
 if(!answered)return;
 index++;
 if(index<12)render();
 else finish();
}
function finish(){
 document.getElementById("quizScreen").classList.add("hidden");
 document.getElementById("resultScreen").classList.remove("hidden");
 document.getElementById("barFill").style.width="100%";
 const best=Math.max(score,Number(localStorage.getItem("talhaPersonalBest")||0));
 localStorage.setItem("talhaPersonalBest",best);
 localStorage.setItem("talhaPersonalTotal",Number(localStorage.getItem("talhaPersonalTotal")||0)+score);
 document.getElementById("result").textContent=score+" / 120 puan";
 document.getElementById("resultEmoji").textContent=score>=100?"👑":score>=70?"🏆":score>=40?"😎":"💜";
 document.getElementById("resultMessage").textContent=
 score>=100?"İnanılmaz! Talha'yı çok iyi tanıyorsun!":
 score>=70?"Harika! Talha hakkında bayağı şey biliyorsun!":
 score>=40?"Fena değil! Biraz daha dikkatli ol!":
 "Daha öğrenecek çok şey var! Bir daha dene.";
 const rewards=[
 {min:0,icon:"💜",title:"Yeni Tanışan",text:"Talha'yı tanıma yolculuğun başladı!"},
 {min:40,icon:"🔍",title:"Meraklı Dedektif",text:"Talha hakkında bazı detayları biliyorsun!"},
 {min:70,icon:"🥇",title:"Talha Uzmanı",text:"Talha'yı iyi tanıyorsun!"},
 {min:100,icon:"👑",title:"Efsane Dost",text:"Talha hakkında neredeyse her şeyi biliyorsun!"}
 ].filter(r=>score>=r.min).pop();
 document.getElementById("rewardIcon").textContent=rewards.icon;
 document.getElementById("rewardTitle").textContent=rewards.title;
 document.getElementById("rewardText").textContent=rewards.text;
 lastResult=`Talha'yı Ne Kadar Tanıyorsun? ${score}/120 puan aldım!`;
 updateStats();
}
function home(){
 document.getElementById("resultScreen").classList.add("hidden");
 document.getElementById("startScreen").classList.remove("hidden");
 document.getElementById("copyMessage").textContent="";
}
async function copyResult(){
 const msg=document.getElementById("copyMessage");
 try{
  await navigator.clipboard.writeText(lastResult);
  msg.textContent="✅ Sonucun kopyalandı!";
 }catch{
  msg.textContent=lastResult;
 }
}
updateStats();
</script>
</body>
</html>
