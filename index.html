
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talha'yı Ne Kadar Tanıyorsun?</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px;
 font-family:Arial,sans-serif;color:white;text-align:center;
 background:radial-gradient(circle at top,#36206b,#100d24 65%);
}
.container{
 max-width:720px;margin:25px auto;padding:25px;
 background:#19152beF;border:1px solid #8062ff;
 border-radius:25px;box-shadow:0 0 35px #6b42ff44;
}
h1{color:#c9b7ff;font-size:clamp(27px,5vw,42px)}
.subtitle{color:#c7bedf;line-height:1.6}
button{
 border:0;border-radius:13px;padding:14px 18px;
 margin:7px;font-weight:bold;font-size:16px;
 cursor:pointer;transition:.2s;
}
button:hover{transform:scale(1.03)}
.primary{background:#8b5cf6;color:white}
.option{
 display:block;width:100%;margin:10px 0;text-align:left;
 background:#29233f;color:white;border:1px solid #51466f;
}
.option:hover{background:#413365}
.option:disabled{cursor:default;opacity:1}
.option.correct{background:#176b4a;border-color:#43e5a0}
.option.wrong{background:#7d2b46;border-color:#ff7398}
#question{font-size:23px;line-height:1.4}
#progress{color:#c7b4ff;font-weight:bold}
#feedback{min-height:28px;font-weight:bold;margin:14px 0}
#result{font-size:22px;color:#ffe18a}
.hidden{display:none}
.bar{height:10px;background:#302746;border-radius:20px;overflow:hidden}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#ff70d9)}
.small{font-size:13px;color:#a99fbe}
</style>
</head>
<body>
<div class="container">
 <div style="font-size:48px">🕹️</div>
 <h1>Talha'yı Ne Kadar Tanıyorsun?</h1>
 <p class="subtitle">Talha'nın sırlarını değil, onu ne kadar iyi tanıdığını test et! 👀</p>

 <div id="home">
  <p>🎯 Sorular: 15</p>
  <p>⭐ Her doğru cevap: 10 puan</p>
  <p>🎲 Seçenekler her oyunda karışır!</p>
  <p>🏆 Bakalım gerçek Talha uzmanı kim?</p>
  <button class="primary" onclick="startQuiz()">🚀 TESTE BAŞLA</button>
 </div>

 <div id="quiz" class="hidden">
  <p id="progress"></p>
  <div class="bar"><div id="barFill"></div></div>
  <h2 id="question"></h2>
  <div id="options"></div>
  <div id="feedback"></div>
  <button id="next" class="primary hidden" onclick="nextQuestion()">Sonraki soru ➜</button>
 </div>

 <div id="resultScreen" class="hidden">
  <h2>🎉 TEST BİTTİ!</h2>
  <p id="result"></p>
  <p id="rank"></p>
  <p id="message"></p>
  <button class="primary" onclick="startQuiz()">🔄 Tekrar Oyna</button>
  <button onclick="copyResult()">📋 Sonucumu Kopyala</button>
 </div>
 <p class="small">Talha'nın arkadaşlarına meydan okuma zamanı 😎</p>
</div>

<script>
const questions = [
 {q:"Talha'nın en yakın arkadaşları kimler?",a:["Ömer ve Yasin","Ali ve Veli","Ahmet ve Mehmet","Efe ve Emir"],c:0},
 {q:"Talha'nın en çok istediği özel güç hangisi?",a:["Uçmak","Görünmez olmak","Yemek yiyip kilo almamak","Zamanı durdurmak"],c:2},
 {q:"Talha'nın en sevdiği oyun hangisi?",a:["Roblox","Minecraft","FIFA","Among Us"],c:1},
 {q:"Talha hangi oyunda bloklarla dünyalar kurmayı seviyor?",a:["Minecraft","Zula","Brawl Stars","GTA"],c:0},
 {q:"Talha'nın favori Brawl Stars karakteri kim?",a:["Shelly","Leon","Spike","Frank"],c:3},
 {q:"Talha hangi programlama dilini öğreniyor?",a:["Java","Python","C++","Scratch"],c:1},
 {q:"Talha'nın oyun sitesi projesinin adı ne?",a:["Mini Oyun Merkezi","Süper Market","Mega Yarış","Oyun Dünyası"],c:0},
 {q:"Talha kendi web sitelerini hangi platformda yayınladı?",a:["TikTok","Discord","GitHub Pages","Spotify"],c:2},
 {q:"Talha bir web sitesindeki hata için genellikle ne yapmaya çalışıyor?",a:["Bilgisayarı atmak 😂","Hemen vazgeçmek","Ekranı kapatmak","Kodu düzeltmek"],c:3},
 {q:"Talha'nın annesine hazırladığı site ne içindi?",a:["Yeni yıl","Doğum günü hediyesi","Okul ödevi","Oyun turnuvası"],c:1},
 {q:"Talha'nın ayrı geliştirdiği oyun projesinin adı neydi?",a:["Silah Oyunu","Balon Patlatma","Araba Parkı","Uzay Macerası"],c:0},
 {q:"Talha bilgisayarında hangi tür projeler geliştirmeyi seviyor?",a:["Sadece hesap tabloları","Sadece sunumlar","Web siteleri ve oyunlar","Sadece müzik listeleri"],c:2},
 {q:"Talha bir oyuna yeni özellik eklerken en çok ne ister?",a:["Daha az özellik","Her şeyin aynı kalması","Oyunun kapanması","Daha eğlenceli ve havalı şeyler"],c:3},
 {q:"Talha Python ile nasıl bir oyun yapmak istemişti?",a:["Kelime defteri","Minecraft benzeri blok oyunu","Takvim","Hesap tablosu"],c:1},
 {q:"Talha'nın yaptığı testin asıl amacı ne?",a:["Arkadaşlarının onu ne kadar tanıdığını görmek","Matematik sınavı yapmak","Şifre dağıtmak","Bilgisayar satmak"],c:0}
];

let quizQuestions=[],index=0,score=0,answered=false,lastScore=0;

function shuffle(arr){
 for(let i=arr.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}

function startQuiz(){
 quizQuestions=shuffle(questions.map(q=>{
  const choices=q.a.map((text,i)=>({text,correct:i===q.c}));
  shuffle(choices);
  return {q:q.q,choices};
 }));
 index=0;score=0;answered=false;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("resultScreen").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 showQuestion();
}

function showQuestion(){
 answered=false;
 const q=quizQuestions[index];
 document.getElementById("progress").textContent=
  `Soru ${index+1} / ${quizQuestions.length} • Puan: ${score}`;
 document.getElementById("barFill").style.width=
  `${index/quizQuestions.length*100}%`;
 document.getElementById("question").textContent=q.q;
 document.getElementById("feedback").textContent="";
 document.getElementById("next").classList.add("hidden");
 const options=document.getElementById("options");
 options.innerHTML="";
 q.choices.forEach((choice,i)=>{
  const btn=document.createElement("button");
  btn.className="option";
  btn.textContent=["A","B","C","D"][i]+") "+choice.text;
  btn.onclick=()=>chooseAnswer(i);
  options.appendChild(btn);
 });
}

function chooseAnswer(i){
 if(answered)return;
 answered=true;
 const q=quizQuestions[index];
 const buttons=[...document.querySelectorAll(".option")];
 buttons.forEach((btn,j)=>{
  btn.disabled=true;
  if(q.choices[j].correct)btn.classList.add("correct");
 });
 const feedback=document.getElementById("feedback");
 if(q.choices[i].correct){
  score+=10;
  feedback.textContent=["🔥 Helal! Talha uzmanı!","😎 Nokta atışı!","🧠 Bunu da bildin!","🏆 Efsane cevap!"][Math.floor(Math.random()*4)];
 }else{
  buttons[i].classList.add("wrong");
  feedback.textContent=["😂 Olmadı be!","🤔 Talha'yı biraz daha tanı!","💀 Bu cevap fena patladı!","😅 Bir dahaki sefere!"][Math.floor(Math.random()*4)];
 }
 document.getElementById("progress").textContent=
  `Soru ${index+1} / ${quizQuestions.length} • Puan: ${score}`;
 document.getElementById("next").textContent=
  index===quizQuestions.length-1?"🏁 Sonucu Gör":"Sonraki soru ➜";
 document.getElementById("next").classList.remove("hidden");
}

function nextQuestion(){
 if(!answered)return;
 index++;
 if(index<quizQuestions.length)showQuestion();
 else showResult();
}

function showResult(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("resultScreen").classList.remove("hidden");
 document.getElementById("barFill").style.width="100%";
 lastScore=score;
 document.getElementById("result").textContent=`${score} / ${questions.length*10} puan`;
 let rank,message;
 if(score===150){
  rank="👑 TALHA'NIN İKİZİ!";
  message="Sen Talha'yı ezbere biliyorsun. Bu nasıl bir hafıza?!";
 }else if(score>=120){
  rank="🔥 GERÇEK TALHA UZMANI!";
  message="Talha seni arkadaş listesinin VIP bölümüne alabilir.";
 }else if(score>=80){
  rank="😎 SAĞLAM ARKADAŞ!";
  message="Talha'yı iyi tanıyorsun ama keşfedilecek şeyler var.";
 }else if(score>=40){
  rank="🧐 YENİ YENİ TANIYORSUN!";
  message="Biraz daha takılın, sonraki testte yükselirsin.";
 }else{
  rank="😂 SEN HANGİ EVRENDENSİN?";
  message="Talha'yla tanışma güncellemesi gerekiyor galiba!";
 }
 document.getElementById("rank").textContent=rank;
 document.getElementById("message").textContent=message;
}

function copyResult(){
 const text=`Talha'yı Ne Kadar Tanıyorsun? ${lastScore}/150 puan aldım! 😎`;
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(text).then(()=>alert("Sonucun kopyalandı! 📋"))
  .catch(()=>prompt("Sonucunu kopyala:",text));
 }else prompt("Sonucunu kopyala:",text);
}
</script>
</body>
</html>
